<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <!-- PWA: installable on Android/iPhone (Add to Home Screen → standalone app). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser tab favicon (new THORX mark, replaces the default letter icon) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <!-- Matches the site's page background so the OS status bar blends into
         the page instead of showing as a separate colored block. -->
    <meta name="theme-color" content="#EAE5DD" />
    <meta name="description" content="Earn real money by watching rewarded ads, completing paid surveys, and competing in guild wars. JazzCash & EasyPaisa payouts." />
    <!-- SEO: canonical + Open Graph + Twitter cards -->
    <link rel="canonical" href="https://thorx.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THORX" />
    <meta property="og:title" content="THORX — Earn Real Money in Pakistan" />
    <meta property="og:description" content="Watch rewarded ads, complete paid surveys, win guild wars. Real PKR earnings via JazzCash & EasyPaisa." />
    <meta property="og:url" content="https://thorx.site/" />
    <meta property="og:image" content="https://thorx.site/icons/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="THORX — Earn Real Money in Pakistan" />
    <meta name="twitter:description" content="Rewarded ads, paid surveys, guild wars. JazzCash & EasyPaisa payouts." />
    <meta name="twitter:image" content="https://thorx.site/icons/apple-touch-icon.png" />
    <!-- iOS standalone-app treatment: black-translucent lets page content
         extend under the status bar (true edge-to-edge). Fixed headers pad
         themselves with env(safe-area-inset-top) so nothing is hidden. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="THORX" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the universal avatar set so it's already in the browser cache
         (profile modal, admin panels, leaderboard, referral tree) instead of
         being fetched the first time each one renders. -->
    <link rel="preload" as="image" href="/avatars/avatar-1.png">
    <link rel="preload" as="image" href="/avatars/avatar-2.png">
    <link rel="preload" as="image" href="/avatars/avatar-3.png">
    <link rel="preload" as="image" href="/avatars/avatar-4.png">
    <link rel="preload" as="image" href="/avatars/avatar-5.png">
    <link rel="preload" as="image" href="/avatars/avatar-6.png">
    <!-- Only Inter is actually referenced by the app (--font-sans; serif/mono
         fall back to Georgia / Courier New). The previous link fetched 25 font
         families (~2MB+) and blocked first paint — the single variable Inter
         below (weights 300-900, display=swap) covers every weight the UI uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
