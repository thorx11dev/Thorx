<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload the universal avatar set so it's already in the browser cache
         (profile modal, admin panels, leaderboard, referral tree) instead of
         being fetched the first time each one renders. -->
    <link rel="preload" as="image" href="/avatars/avatar-1.png">
    <link rel="preload" as="image" href="/avatars/avatar-2.png">
    <link rel="preload" as="image" href="/avatars/avatar-3.png">
    <link rel="preload" as="image" href="/avatars/avatar-4.png">
    <link rel="preload" as="image" href="/avatars/avatar-5.png">
    <link rel="preload" as="image" href="/avatars/avatar-6.png">
    <!-- Only Inter is actually referenced by the app (--font-sans; serif/mono
         fall back to Georgia / Courier New). The previous link fetched 25 font
         families (~2MB+) and blocked first paint — the single variable Inter
         below (weights 300-900, display=swap) covers every weight the UI uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
